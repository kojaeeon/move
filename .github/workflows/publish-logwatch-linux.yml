name: Publish Logwatch Linux portable
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-logwatch-linux.yml]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kojaeeon/rust_toy
          ref: 5927cb54fa6f79069e90ae37916472058d9918ca
          path: rust-toy
          persist-credentials: false
      - name: Test and build Linux x64
        working-directory: rust-toy/logwatch
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install 1.100.0 --profile minimal --target x86_64-unknown-linux-musl
          cargo +1.100.0 test --locked --target x86_64-unknown-linux-musl
          cargo +1.100.0 build --locked --release --target x86_64-unknown-linux-musl
      - name: Package and verify the extracted archive
        working-directory: rust-toy/logwatch
        run: |
          set -euo pipefail
          name='logwatch-0.1.4-linux-x64-portable'
          stage="$RUNNER_TEMP/stage/$name"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$stage/logs" "$verify"
          install -m 0755 target/x86_64-unknown-linux-musl/release/logwatch "$stage/logwatch"
          install -m 0644 logwatch.toml "$stage/logwatch.toml"
          install -m 0644 logs/application.log "$stage/logs/application.log"
          cat > "$stage/README.md" <<'EOF'
          # Logwatch 0.1.4 — Linux x86-64

          압축을 푼 폴더에서 실행하세요.

          ~~~bash
          ./logwatch --dump ./logs/application.log
          ./logwatch /path/to/application.log
          ~~~

          SSH 터미널에서 x는 XML 보기, v는 원문 보기, q는 종료입니다.
          y는 서버의 Wayland(xclip 대신 wl-copy 사용) 또는 X11(xclip) 클립보드를 사용합니다.
          일반 SSH 접속에서는 PC 클립보드로 복사할 때 터미널의 복사 기능을 사용하세요.

          [소스 및 사용 가이드](https://github.com/kojaeeon/rust_toy/tree/5927cb54fa6f79069e90ae37916472058d9918ca/logwatch)
          EOF
          archive="$RUNNER_TEMP/$name.tar.gz"
          tar -C "$RUNNER_TEMP/stage" -czf "$archive" "$name"
          tar -C "$verify" -xzf "$archive"
          cd "$verify/$name"
          test -x ./logwatch
          file ./logwatch | tee "$RUNNER_TEMP/logwatch-file.txt"
          grep -Fq 'x86-64' "$RUNNER_TEMP/logwatch-file.txt"
          readelf -lW ./logwatch > "$RUNNER_TEMP/logwatch-program-headers.txt"
          readelf -dW ./logwatch > "$RUNNER_TEMP/logwatch-dynamic.txt"
          if grep -qw INTERP "$RUNNER_TEMP/logwatch-program-headers.txt" ||
             grep -Fq '(NEEDED)' "$RUNNER_TEMP/logwatch-dynamic.txt"; then
            echo 'Expected an executable with no dynamic loader or shared libraries' >&2
            exit 1
          fi
          test "$(./logwatch --version)" = 'logwatch 0.1.4'
          ./logwatch --dump ./logs/application.log > "$RUNNER_TEMP/logwatch-dump.txt"
          grep -Fx '25 events' "$RUNNER_TEMP/logwatch-dump.txt"
          grep -F 'req-001' "$RUNNER_TEMP/logwatch-dump.txt"
      - name: Publish the Linux archive
        run: |
          set -euo pipefail
          archive='logwatch-0.1.4-linux-x64-portable.tar.gz'
          mkdir -p portable/logwatch
          cp "$RUNNER_TEMP/$archive" "portable/logwatch/$archive"
          (cd portable/logwatch && sha256sum "$archive" > "$archive.sha256")
          if ! grep -Fq '## Logwatch 0.1.4 — Linux x64' README.md; then
            cat >> README.md <<'EOF'

          ## Logwatch 0.1.4 — Linux x64

          Linux x86-64용 정적 실행 파일입니다. 압축을 푼 폴더에서
          `./logwatch /path/to/application.log`로 실행하세요.

          - [포터블 TAR.GZ 다운로드](portable/logwatch/logwatch-0.1.4-linux-x64-portable.tar.gz?raw=1)
          - [SHA-256](portable/logwatch/logwatch-0.1.4-linux-x64-portable.tar.gz.sha256)
          EOF
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "portable/logwatch/$archive" "portable/logwatch/$archive.sha256"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Logwatch 0.1.4 Linux x64 portable'
          git pull --rebase origin main
          git push origin HEAD:main
