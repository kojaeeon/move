name: Import OpenIDEA v0.1.39 portable
on:
  push:
    paths:
      - '.github/workflows/import-openidea-0139.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Windows x64 portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p openidea
          curl --fail --location --retry 3 --output openidea/OpenIDEA_0.1.39_windows_x64_portable.zip \
            https://github.com/l0ng-ai/openidea/releases/download/v0.1.39/OpenIDEA_0.1.39_windows_x64_portable.zip
          bytes=$(stat -c%s openidea/OpenIDEA_0.1.39_windows_x64_portable.zip)
          echo "Downloaded $bytes bytes"
          test "$bytes" -lt 100000000
          unzip -t openidea/OpenIDEA_0.1.39_windows_x64_portable.zip
      - name: Commit portable ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openidea/OpenIDEA_0.1.39_windows_x64_portable.zip
          if ! git diff --cached --quiet; then
            git commit -m "Add OpenIDEA v0.1.39 Windows x64 portable"
            git push
          fi
