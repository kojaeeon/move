name: Import OpenIDEA portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-openidea.yml'
permissions:
  contents: write
concurrency:
  group: import-openidea
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: openidea
          fetch-depth: 1
      - name: Download and verify official portable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p openidea
          curl --fail --location --retry 3 'https://github.com/l0ng-ai/openidea/releases/download/v0.1.46/OpenIDEA_0.1.46_windows_x64_portable.zip' -o 'openidea/OpenIDEA_0.1.46_windows_x64_portable.zip'
          echo '8f712f92c527451ff8cb9f59b527b9cde1aba2dc00aa7e84462007857bbaf99d  openidea/OpenIDEA_0.1.46_windows_x64_portable.zip' | sha256sum --check
          unzip -t 'openidea/OpenIDEA_0.1.46_windows_x64_portable.zip'
          sha256sum 'openidea/OpenIDEA_0.1.46_windows_x64_portable.zip' > openidea/SHA256SUMS
          cat > openidea/README.md <<'EOF'
          # OpenIDEA v0.1.46 Windows x64 portable

          공식 Windows x64 포터블 ZIP입니다. 압축을 풀고 실행 파일을 실행하세요.

          원본: https://github.com/l0ng-ai/openidea/releases/tag/v0.1.46
          파일: OpenIDEA_0.1.46_windows_x64_portable.zip
          크기: 84521104 bytes (약 84.5 MB / 80.6 MiB)
          SHA256: 8f712f92c527451ff8cb9f59b527b9cde1aba2dc00aa7e84462007857bbaf99d
          EOF
      - name: Commit portable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openidea
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add OpenIDEA v0.1.46 Windows x64 portable'
          git pull --rebase origin main
          git push origin HEAD:main
