name: Import GridCraft portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gridcraft.yml'
permissions:
  contents: write
concurrency:
  group: import-gridcraft
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official portable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gridcraft
          curl --fail --location --retry 3 'https://github.com/storytold/gridcraft/releases/download/v0.19.1/gridcraft-0.19.1-windows-x64-portable.zip' -o 'gridcraft/gridcraft-0.19.1-windows-x64-portable.zip'
          echo '0b4bf8535f4904fac654326a360ff6d74ea6f4d184a8257c106388fafe74c9ac  gridcraft/gridcraft-0.19.1-windows-x64-portable.zip' | sha256sum --check
          unzip -t 'gridcraft/gridcraft-0.19.1-windows-x64-portable.zip'
          unzip -Z1 'gridcraft/gridcraft-0.19.1-windows-x64-portable.zip' > /tmp/gridcraft-files.txt
          grep -Ei '(^|/)gridcraft\.exe$' /tmp/gridcraft-files.txt
          sha256sum 'gridcraft/gridcraft-0.19.1-windows-x64-portable.zip' > gridcraft/SHA256SUMS
          cat > gridcraft/README.md <<'EOF'
          # GridCraft v0.19.1 Windows x64 portable

          공식 릴리즈의 설치 없는 Windows x64 포터블입니다.
          ZIP 전체를 압축 해제한 뒤 gridcraft.exe를 실행하세요.
          함께 포함된 파일과 폴더도 그대로 유지하세요.

          원본: https://github.com/storytold/gridcraft/releases/tag/v0.19.1
          파일: gridcraft-0.19.1-windows-x64-portable.zip
          크기: 52149109 bytes
          SHA256: 0b4bf8535f4904fac654326a360ff6d74ea6f4d184a8257c106388fafe74c9ac
          EOF
      - name: Commit portable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gridcraft
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add GridCraft v0.19.1 Windows x64 portable'
          git pull --rebase origin main
          git push origin HEAD:main
