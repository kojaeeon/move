name: Replace contents with OpenIDEA portable
on:
  push:
    paths:
      - '.github/workflows/replace-openidea-0145.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official portable
        shell: bash
        run: |
          set -euo pipefail
          task_tmp="$(mktemp -d)"
          file="OpenIDEA_0.1.45_windows_x64_portable.zip"
          base="https://github.com/l0ng-ai/openidea/releases/download/v0.1.45"
          curl --fail --location --retry 3 "$base/$file" -o "$task_tmp/$file"
          curl --fail --location --retry 3 "$base/$file.sha256" -o "$task_tmp/$file.sha256"
          (cd "$task_tmp" && sha256sum --check "$file.sha256")
          unzip -t "$task_tmp/$file"
          git rm -r --ignore-unmatch .
          cp "$task_tmp/$file" "$file"
          git add "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace repository contents with verified OpenIDEA 0.1.45 x64 portable"
          git push origin HEAD:main
