name: Import verified eZterm EXE ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ezterm.yml'

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: kojaeeon/ezTerm
      SOURCE_RUN: '43346755734'
      SOURCE_SHA: ed6d2873dfd389247f573d34c7afa095362dd80d
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the requested Windows build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
            test "$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")" = "$SOURCE_SHA"
            status=$(jq -r .status "$RUNNER_TEMP/source-run.json")
            if [ "$status" = completed ]; then
              test "$(jq -r .conclusion "$RUNNER_TEMP/source-run.json")" = success
              exit 0
            fi
            sleep 20
          done
          echo "::error::Source build did not finish in time"
          exit 1

      - name: Download and verify the EXE ZIP
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name == "ezTerm-windows-x64-exe" and .expired == false) | .id')
          test -n "$artifact"
          gh api "repos/$SOURCE_REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/ezterm.zip"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ezterm.zip'
          assert 0 < source.stat().st_size < 100_000_000
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None
              files = [info for info in archive.infolist() if not info.is_dir()]
              assert len(files) == 1 and files[0].filename == 'ezterm.exe', [i.filename for i in files]
              with archive.open(files[0]) as executable:
                  assert executable.read(2) == b'MZ', 'Not a Windows executable'
              print('Verified EXE bytes:', files[0].file_size)
          print('ZIP SHA256:', hashlib.sha256(source.read_bytes()).hexdigest())
          pathlib.Path('ezterm.zip').write_bytes(source.read_bytes())
          PY

      - name: Commit verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ezterm.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: import eZterm Windows EXE from ed6d287"
            git push origin HEAD:main
          fi
