name: Package DeckCraft Windows x64
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-deckcraft.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-deckcraft
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deckcraft-source
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 \
            -o /tmp/deckcraft-source/deckcraft-0.18.1-windows-x64-portable.zip \
            https://github.com/storytold/deckcraft/releases/download/v0.18.1/deckcraft-0.18.1-windows-x64-portable.zip
          echo '6df6f60b2182065c427fe4c3fe1b5d74b92706b238c6f35f3f91e5f359042e99  /tmp/deckcraft-source/deckcraft-0.18.1-windows-x64-portable.zip' | sha256sum --check
          7z t /tmp/deckcraft-source/deckcraft-0.18.1-windows-x64-portable.zip
      - name: Create 25 MB split archive and verify extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deckcraft-v0.18.1
          rm -f deckcraft-v0.18.1/deckcraft-0.18.1-windows-x64-portable.7z.*
          cd /tmp/deckcraft-source
          7z a -t7z -mx=0 -v25000000b "$GITHUB_WORKSPACE/deckcraft-v0.18.1/deckcraft-0.18.1-windows-x64-portable.7z" deckcraft-0.18.1-windows-x64-portable.zip
          cd "$GITHUB_WORKSPACE/deckcraft-v0.18.1"
          7z t deckcraft-0.18.1-windows-x64-portable.7z.001
          7z x deckcraft-0.18.1-windows-x64-portable.7z.001 -o/tmp/deckcraft-verified -y
          cmp /tmp/deckcraft-source/deckcraft-0.18.1-windows-x64-portable.zip /tmp/deckcraft-verified/deckcraft-0.18.1-windows-x64-portable.zip
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path('.').glob('*.7z.*'))
          assert len(parts) == 5, len(parts)
          for p in parts:
              assert p.stat().st_size <= 25_000_000
              print(p.name, p.stat().st_size)
          PY
          sha256sum *.7z.* > SHA256SUMS.txt
          cat > README.md <<'DOC'
          # DeckCraft v0.18.1 — Windows x64 포터블

          원본: https://github.com/storytold/deckcraft/releases/tag/v0.18.1

          ## 압축 해제

          1. 아래 다섯 파일을 모두 다운로드하여 같은 폴더에 두세요.
             - deckcraft-0.18.1-windows-x64-portable.7z.001
             - deckcraft-0.18.1-windows-x64-portable.7z.002
             - deckcraft-0.18.1-windows-x64-portable.7z.003
             - deckcraft-0.18.1-windows-x64-portable.7z.004
             - deckcraft-0.18.1-windows-x64-portable.7z.005
          2. 7-Zip 또는 반디집에서 **.7z.001**을 열어 압축을 푸세요.
          3. 나온 **deckcraft-0.18.1-windows-x64-portable.zip**도 압축을 풀어 사용하세요.

          각 조각은 최대 **25,000,000바이트(25 MB)**입니다. 파일명을 변경하지 마세요.
          원본 ZIP을 그대로 담았으며 실행파일은 수정하지 않았습니다.

          원본 ZIP 크기: 104,449,748바이트 (압축 해제 후 약 214.84 MB)

          원본 ZIP SHA-256: `6df6f60b2182065c427fe4c3fe1b5d74b92706b238c6f35f3f91e5f359042e99`

          조각별 체크섬: [SHA256SUMS.txt](SHA256SUMS.txt)

          공식 SHA-256, 원본 ZIP 무결성, 분할압축 해제 후 원본 일치를 검증했습니다.
          DOC
      - name: Commit verified volumes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deckcraft-v0.18.1
          if git diff --cached --quiet; then
            echo "Files already up to date."
            exit 0
          fi
          git commit -m "Add verified DeckCraft v0.18.1 x64 portable in 25 MB volumes"
          git pull --rebase origin main
          git push origin HEAD:main
