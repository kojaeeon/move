name: Publish Logwatch portable
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-logwatch.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: move
      - uses: actions/checkout@v4
        with:
          repository: kojaeeon/rust_toy
          ref: 315a46e18d152b9ea5004531ed79ca0d509d334a
          path: rust-toy
          persist-credentials: false
      - name: Test and build Windows x64
        working-directory: rust-toy/logwatch
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal
          cargo +1.100.0-x86_64-pc-windows-msvc test --locked --target x86_64-pc-windows-msvc
          cargo +1.100.0-x86_64-pc-windows-msvc build --locked --release --target x86_64-pc-windows-msvc
      - name: Verify the portable ZIP on Windows
        working-directory: rust-toy/logwatch
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP 'logwatch-stage'
          $verify = Join-Path $env:RUNNER_TEMP 'logwatch-verify'
          New-Item -ItemType Directory -Path $stage, "$stage/logs", "$stage/scripts" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/logwatch.exe,logwatch.toml,README.md $stage
          Copy-Item logs/application.log "$stage/logs"
          Copy-Item scripts/replay.ps1 "$stage/scripts"
          $zip = Join-Path $env:RUNNER_TEMP 'logwatch-0.1.1-windows-x64-portable.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $verify
          Push-Location $verify
          try {
            if ((./logwatch.exe --version) -ne 'logwatch 0.1.1') { throw 'Unexpected logwatch version' }
            $dump = ./logwatch.exe --dump --config ./logwatch.toml | Out-String
            if (-not $dump.Contains('25 events')) { throw 'Expected 25 sample events' }
            @'
          2026-11-20 11:01:58,941 INFO [jdbc.sqlonly.sqlOccurred(741)] SQL::WITH TEMP1 (
            id
          ) AS (SELECT id FROM orders)
          SELECT id FROM TEMP1 ORDER BY final_marker;
          '@ | Set-Content -Encoding utf8 cte.log
            $dump = ./logwatch.exe ./cte.log --dump | Out-String
            if (-not ($dump.Contains('INFO  SQL') -and $dump.Contains('final_marker'))) {
              throw 'The JDBC CTE was not classified as SQL or lost its final line'
            }
          } finally {
            Pop-Location
          }
      - name: Replace the Logwatch package
        working-directory: move
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --no-tags origin main
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD:portable/logwatch) -ne 'e3d37d095056d5acd1161fbca6bde388b393fff6') {
            throw 'Logwatch package changed while the build was running'
          }
          $destination = 'portable/logwatch'
          $oldZip = 'logwatch-0.1.0-windows-x64-portable.zip'
          $zip = 'logwatch-0.1.1-windows-x64-portable.zip'
          git rm -- "$destination/$oldZip" "$destination/$oldZip.sha256"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP $zip) $destination
          $checksum = (Get-FileHash -Algorithm SHA256 "$destination/$zip").Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "$destination/$zip.sha256" "$checksum  $zip"
          $readme = Get-Content -Raw -Encoding utf8 README.md
          $readme = $readme.Replace('Logwatch 0.1.0','Logwatch 0.1.1').Replace($oldZip,$zip)
          $readme = $readme.Replace('b7ddb30ccc6f2c5aebac2b92169d42f6ceea536e','315a46e18d152b9ea5004531ed79ca0d509d334a')
          Set-Content -NoNewline -Encoding utf8 README.md $readme
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md "$destination"
          git commit -m 'Update Logwatch Windows x64 portable to 0.1.1'
          git push origin HEAD:main
