name: Publish Logwatch portable
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-logwatch.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: move
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: kojaeeon/rust_toy
          ref: b7ddb30ccc6f2c5aebac2b92169d42f6ceea536e
          path: rust-toy
          persist-credentials: false
      - name: Test and build Windows x64
        working-directory: rust-toy/logwatch
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal
          cargo +1.100.0-x86_64-pc-windows-msvc test --locked --target x86_64-pc-windows-msvc
          cargo +1.100.0-x86_64-pc-windows-msvc build --release --locked --target x86_64-pc-windows-msvc
      - name: Package and test the extracted ZIP
        working-directory: rust-toy/logwatch
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP 'logwatch-stage'
          $verify = Join-Path $env:RUNNER_TEMP 'logwatch-verify'
          New-Item -ItemType Directory -Path $stage, "$stage/logs", "$stage/scripts" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/logwatch.exe,logwatch.toml,README.md $stage
          Copy-Item logs/application.log "$stage/logs"
          Copy-Item scripts/replay.ps1 "$stage/scripts"
          $zip = Join-Path $env:RUNNER_TEMP 'logwatch-0.1.0-windows-x64-portable.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $verify
          Push-Location $verify
          try {
            $version = ./logwatch.exe --version
            if ($version -ne 'logwatch 0.1.0') { throw "Unexpected version $version" }
            $dump = ./logwatch.exe --dump --config ./logwatch.toml | Out-String
            foreach ($marker in @('25 events', 'req-001', 'SQL', 'XML', 'ERROR')) {
              if (-not $dump.Contains($marker)) { throw "Sample dump missing $marker" }
            }
            Write-Host "$version sample dump verified (25 events)"
          } finally {
            Pop-Location
          }
      - name: Replace portable folder on main
        working-directory: move
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch --no-tags origin main
          git checkout --detach FETCH_HEAD
          $portableTree = git rev-parse HEAD:portable
          if ($portableTree -ne '115c4f9472edec3fe7c8524af5f6714601493255') {
            throw "The portable folder changed during the build ($portableTree)."
          }
          $zip = 'logwatch-0.1.0-windows-x64-portable.zip'
          $destination = 'portable/logwatch'
          git rm -r -- portable
          New-Item -ItemType Directory -Path $destination | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP $zip) $destination
          $checksum = (Get-FileHash -Algorithm SHA256 "$destination/$zip").Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "$destination/$zip.sha256" "$checksum  $zip"
          @'
          # Portable downloads

          ## Logwatch 0.1.0 — Windows x64

          Java·SQL·XML 로그를 실시간으로 보는 터미널 프로그램입니다. ZIP을 압축 해제하고 해당 폴더에서 PowerShell 또는 ezTerm을 열어 실행하세요.

          ~~~powershell
          .\logwatch.exe
          .\logwatch.exe 'C:\server\logs\application.log'
          .\logwatch.exe --dump
          ~~~

          - [포터블 ZIP 다운로드](portable/logwatch/logwatch-0.1.0-windows-x64-portable.zip?raw=1)
          - [SHA-256](portable/logwatch/logwatch-0.1.0-windows-x64-portable.zip.sha256)
          - [소스 커밋](https://github.com/kojaeeon/rust_toy/commit/b7ddb30ccc6f2c5aebac2b92169d42f6ceea536e)
          '@ | Set-Content -Encoding utf8 README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portable README.md
          git commit -m 'Replace portable downloads with Logwatch 0.1.0 for Windows x64'
          git push origin HEAD:main
