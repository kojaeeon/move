name: Import OpenIDEA v0.1.42 portable
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-openidea-0140.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p openidea
          url="https://github.com/l0ng-ai/openidea/releases/download/v0.1.42/OpenIDEA_0.1.42_windows_x64_portable.zip"
          dest="openidea/OpenIDEA_0.1.42_windows_x64_portable.zip"
          curl --fail --location --retry 3 "$url" -o "$dest"
          bytes=$(stat -c%s "$dest")
          echo "Downloaded $bytes bytes"
          if [ "$bytes" -ge 100000000 ]; then
            echo "::error::File exceeds GitHub's 100MB limit"
            exit 1
          fi
          unzip -t "$dest"
          echo "d8d993d1f68eaaf69ffd619119974d09bb110e389065fd49cc41823ccd20258e  $dest" | sha256sum --check
          git rm --ignore-unmatch openidea/OpenIDEA_0.1.40_windows_x64_portable.zip
      - name: Commit ZIP to move
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openidea/OpenIDEA_0.1.42_windows_x64_portable.zip
          if ! git diff --cached --quiet; then
            git commit -m "Update OpenIDEA to v0.1.42 Windows x64 portable"
            git push
          fi
